name: vocalmarket

# Extends the base Enthusiast stack with VocalMarket-specific services.
# Run: docker compose -f docker-compose.yml -f docker-compose.vocalmarket.yml up
#
# Services added:
#   voice           — Whisper STT + ElevenLabs TTS WebSocket service
#   ai-orchestrator — Feature-flagged AI routing (V1: Enthusiast | V2: Hermes)
#   api-gateway     — Single ingress for mobile/web clients
#   whisper         — Self-hosted faster-whisper-server (STT)
#   payments        — ForgePay + x402 payment service
#   medusa          — Medusa.js commerce engine
#   intelligence    — Supplier intelligence store (the data moat)
#   messaging       — Omnichannel ingress (Telegram, WhatsApp, SMS, Slack, Teams, USSD)
#   otel-collector  — OpenTelemetry collector

services:
  # ─── Voice Processing ──────────────────────────────────────────────────────
  voice:
    build:
      context: ./vocalmarket/services/voice
      dockerfile: Dockerfile
    ports:
      - "8003:8003"
    environment:
      - VOICE_WHISPER_BASE_URL=http://whisper:9000
      - VOICE_ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - VOICE_VOICE_ID_ZA_ENGLISH=${ELEVENLABS_VOICE_ID_ZA:-21m00Tcm4TlvDq8ikWAM}
    depends_on:
      - whisper
      - ai-orchestrator
    restart: unless-stopped

  whisper:
    image: fedirz/faster-whisper-server:latest-cuda
    ports:
      - "9000:9000"
    environment:
      - WHISPER__MODEL=large-v3
      - WHISPER__LANGUAGE=en
    volumes:
      - whisper-models:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # ─── AI Orchestrator ───────────────────────────────────────────────────────
  ai-orchestrator:
    build:
      context: ./vocalmarket/services/ai-orchestrator
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    environment:
      # Feature flag: "enthusiast" for V1, "hybrid" for V2
      - VOCALMARKET_AI_LAYER=${VOCALMARKET_AI_LAYER:-enthusiast}
      - ORCHESTRATOR_ENTHUSIAST_BASE_URL=http://api:8000
      - ORCHESTRATOR_ENTHUSIAST_API_KEY=${ENTHUSIAST_API_KEY}
      - ORCHESTRATOR_MEMORY_DB_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-postgres}
      - ORCHESTRATOR_REDIS_URL=redis://redis:6379/1
      # V2 Hermes settings (only used when AI_LAYER=hybrid)
      - ORCHESTRATOR_HERMES_MODEL=${HERMES_MODEL:-NousResearch/Hermes-3-Llama-3.1-8B}
      - ORCHESTRATOR_HERMES_BASE_URL=${HERMES_BASE_URL:-}
      - ORCHESTRATOR_HERMES_API_KEY=${HERMES_API_KEY:-}
      # Vertical DataSet mappings
      - VOCALMARKET_GROCERY_DATA_SET_ID=${GROCERY_DATA_SET_ID}
      - VOCALMARKET_GROCERY_PRODUCT_SEARCH_AGENT_ID=${GROCERY_PRODUCT_SEARCH_AGENT_ID}
      - VOCALMARKET_GROCERY_ORDER_INTAKE_AGENT_ID=${GROCERY_ORDER_INTAKE_AGENT_ID}
      - VOCALMARKET_B2B_DATA_SET_ID=${B2B_DATA_SET_ID}
      - VOCALMARKET_HEALTHCARE_DATA_SET_ID=${HEALTHCARE_DATA_SET_ID}
      # OpenTelemetry
      - ORCHESTRATOR_OTEL_ENDPOINT=http://otel-collector:4317
    depends_on:
      - postgres
      - redis
      - api
    restart: unless-stopped

  # ─── API Gateway ───────────────────────────────────────────────────────────
  api-gateway:
    build:
      context: ./vocalmarket/services/api-gateway
      dockerfile: Dockerfile
    ports:
      - "80:8000"
      - "443:8443"
    environment:
      - GATEWAY_VOICE_SERVICE_URL=http://voice:8003
      - GATEWAY_ORCHESTRATOR_URL=http://ai-orchestrator:8002
      - GATEWAY_ENTHUSIAST_URL=http://api:8000
      - GATEWAY_REDIS_URL=redis://redis:6379/0
      - GATEWAY_JWT_SECRET=${JWT_SECRET}
      - GATEWAY_ENTHUSIAST_SERVICE_TOKEN=${GATEWAY_ENTHUSIAST_SERVICE_TOKEN:-}
      - GATEWAY_ALLOWED_ORIGINS=${GATEWAY_ALLOWED_ORIGINS:-}
    depends_on:
      - voice
      - ai-orchestrator
      - api
    restart: unless-stopped

  # ─── Supplier Intelligence ─────────────────────────────────────────────────
  intelligence:
    build:
      context: ./vocalmarket/services/intelligence
      dockerfile: Dockerfile
    ports:
      - "8004:8004"
    environment:
      - INTELLIGENCE_DB_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-postgres}
      - INTELLIGENCE_OPENAI_API_KEY=${INTELLIGENCE_OPENAI_API_KEY:-}
      - INTELLIGENCE_EMBEDDING_MODEL=${INTELLIGENCE_EMBEDDING_MODEL:-text-embedding-3-small}
    depends_on:
      - postgres
    restart: unless-stopped

  # ─── Analytics (Bloomberg data model) ──────────────────────────────────────
  analytics:
    build:
      context: ./vocalmarket/services/analytics
      dockerfile: Dockerfile
    ports:
      - "8005:8005"
    environment:
      - ANALYTICS_DB_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-postgres}
      - ANALYTICS_API_KEYS=${ANALYTICS_API_KEYS:-}
    depends_on:
      - postgres
      - intelligence
    restart: unless-stopped

  # ─── Messaging (omnichannel ingress) ───────────────────────────────────────
  messaging:
    build:
      context: ./vocalmarket/services/messaging
      dockerfile: Dockerfile
    ports:
      - "8006:8006"
    environment:
      - MESSAGING_ORCHESTRATOR_URL=http://ai-orchestrator:8002
      - MESSAGING_PUBLIC_BASE_URL=${MESSAGING_PUBLIC_BASE_URL:-http://localhost:8006}
      - MESSAGING_DEFAULT_VERTICAL=${MESSAGING_DEFAULT_VERTICAL:-grocery}
      - MESSAGING_REDIS_URL=redis://redis:6379/3
      # Voice service (for TTS replies to voice notes)
      - MESSAGING_VOICE_SERVICE_URL=http://voice:8003
      # Telegram
      - MESSAGING_TELEGRAM_BOT_TOKEN=${MESSAGING_TELEGRAM_BOT_TOKEN:-}
      - MESSAGING_TELEGRAM_WEBHOOK_SECRET=${MESSAGING_TELEGRAM_WEBHOOK_SECRET:-}
      - MESSAGING_TELEGRAM_PAYMENT_PROVIDER_TOKEN=${MESSAGING_TELEGRAM_PAYMENT_PROVIDER_TOKEN:-}
      # WhatsApp (Meta Cloud API)
      - MESSAGING_WHATSAPP_ACCESS_TOKEN=${MESSAGING_WHATSAPP_ACCESS_TOKEN:-}
      - MESSAGING_WHATSAPP_PHONE_NUMBER_ID=${MESSAGING_WHATSAPP_PHONE_NUMBER_ID:-}
      - MESSAGING_WHATSAPP_APP_SECRET=${MESSAGING_WHATSAPP_APP_SECRET:-}
      - MESSAGING_WHATSAPP_VERIFY_TOKEN=${MESSAGING_WHATSAPP_VERIFY_TOKEN:-}
      # SMS (Twilio)
      - MESSAGING_TWILIO_ACCOUNT_SID=${MESSAGING_TWILIO_ACCOUNT_SID:-}
      - MESSAGING_TWILIO_AUTH_TOKEN=${MESSAGING_TWILIO_AUTH_TOKEN:-}
      - MESSAGING_TWILIO_FROM_NUMBER=${MESSAGING_TWILIO_FROM_NUMBER:-}
      # Slack
      - MESSAGING_SLACK_BOT_TOKEN=${MESSAGING_SLACK_BOT_TOKEN:-}
      - MESSAGING_SLACK_SIGNING_SECRET=${MESSAGING_SLACK_SIGNING_SECRET:-}
      # Microsoft Teams
      - MESSAGING_TEAMS_APP_ID=${MESSAGING_TEAMS_APP_ID:-}
      - MESSAGING_TEAMS_APP_PASSWORD=${MESSAGING_TEAMS_APP_PASSWORD:-}
      - MESSAGING_TEAMS_INBOUND_SECRET=${MESSAGING_TEAMS_INBOUND_SECRET:-}
      # USSD (Africa's Talking)
      - MESSAGING_USSD_SERVICE_CODE=${MESSAGING_USSD_SERVICE_CODE:-*384*9000#}
    depends_on:
      - ai-orchestrator
      - voice
      - redis
    restart: unless-stopped

  # ─── Payments ──────────────────────────────────────────────────────────────
  payments:
    build:
      context: ./vocalmarket/services/payments
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - FORGEPAY_API_KEY=${FORGEPAY_API_KEY}
      - FORGEPAY_WEBHOOK_SECRET=${FORGEPAY_WEBHOOK_SECRET}
      - FORGEPAY_MEDUSA_URL=http://medusa:9000
      - FORGEPAY_MEDUSA_API_KEY=${MEDUSA_API_KEY}
    depends_on:
      - medusa
    restart: unless-stopped

  # ─── Commerce Engine ────────────────────────────────────────────────────────
  medusa:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install --production && npx medusa start"
    ports:
      - "9000:9000"
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-postgres}
      - REDIS_URL=redis://redis:6379/2
      - JWT_SECRET=${JWT_SECRET}
      - COOKIE_SECRET=${COOKIE_SECRET:-change-me-in-production}
      - MEDUSA_ADMIN_CORS=${MEDUSA_ADMIN_CORS:-http://localhost:7001}
      - STORE_CORS=${STORE_CORS:-http://localhost:8080}
    volumes:
      - ./vocalmarket/services/commerce:/app
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  # ─── Observability ─────────────────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    volumes:
      - ./vocalmarket/infra/otel/collector.yaml:/etc/otelcol/config.yaml
    ports:
      - "4317:4317"   # gRPC
      - "4318:4318"   # HTTP
    restart: unless-stopped

volumes:
  whisper-models:
