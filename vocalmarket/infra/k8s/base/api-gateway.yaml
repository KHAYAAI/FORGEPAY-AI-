---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: vocalmarket/api-gateway:latest
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - secretRef:
                name: gateway-secret
          env:
            - name: GATEWAY_VOICE_SERVICE_URL
              value: "http://voice:8003"
            - name: GATEWAY_ORCHESTRATOR_URL
              value: "http://ai-orchestrator:8002"
            - name: GATEWAY_ENTHUSIAST_URL
              value: "http://enthusiast-api:8000"
            - name: GATEWAY_REDIS_URL
              value: "redis://redis:6379/0"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  annotations:
    # AWS Load Balancer Controller annotations for ALB
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-path: "/health"
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 80
      targetPort: 8000
    - name: https
      port: 443
      targetPort: 8000
---
# WebSocket-aware Ingress for voice streaming
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vocalmarket-ingress
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    # Set via production overlay: alb.ingress.kubernetes.io/certificate-arn
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:af-south-1:ACCOUNT_ID:certificate/CERT_ID"
    # Keep WebSocket connections alive for voice sessions
    alb.ingress.kubernetes.io/target-group-attributes: "stickiness.enabled=true,stickiness.lb_cookie.duration_seconds=300"
spec:
  rules:
    - host: "api.vocalmarket.co.za"
      http:
        paths:
          - path: /ws/
            pathType: Prefix
            backend:
              service:
                name: voice
                port:
                  number: 8003
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8000
