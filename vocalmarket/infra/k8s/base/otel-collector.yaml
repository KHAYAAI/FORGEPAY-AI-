---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        timeout: 5s
      resource:
        attributes:
          - key: deployment.environment
            value: ${ENVIRONMENT}
            action: insert
      memory_limiter:
        check_interval: 1s
        limit_mib: 400
        spike_limit_mib: 100

    exporters:
      otlp/tempo:
        endpoint: ${TEMPO_ENDPOINT}
        tls:
          insecure: false
      prometheusremotewrite:
        endpoint: ${PROMETHEUS_ENDPOINT}
      debug:
        verbosity: normal

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource]
          exporters: [otlp/tempo]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource]
          exporters: [prometheusremotewrite]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.112.0
          args: ["--config=/conf/config.yaml"]
          env:
            - name: ENVIRONMENT
              value: base
            - name: TEMPO_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: otel-secret
                  key: tempo_endpoint
            - name: PROMETHEUS_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: otel-secret
                  key: prometheus_endpoint
          volumeMounts:
            - name: config
              mountPath: /conf
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          ports:
            - containerPort: 4317
              name: grpc
            - containerPort: 4318
              name: http
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
spec:
  selector:
    app: otel-collector
  ports:
    - name: grpc
      port: 4317
      targetPort: 4317
    - name: http
      port: 4318
      targetPort: 4318
