---
# ExternalSecrets pulls values from AWS Secrets Manager into K8s Secrets.
# Requires external-secrets-operator installed in the cluster.
# Install: helm install external-secrets external-secrets/external-secrets -n external-secrets --create-namespace
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: af-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: vocalmarket-sa
            namespace: vocalmarket
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: postgres-secret
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: vocalmarket/postgres
        property: username
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: vocalmarket/postgres
        property: password
    - secretKey: POSTGRES_DB
      remoteRef:
        key: vocalmarket/postgres
        property: database
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: orchestrator-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: orchestrator-secret
  data:
    - secretKey: ORCHESTRATOR_ENTHUSIAST_API_KEY
      remoteRef:
        key: vocalmarket/orchestrator
        property: enthusiast_api_key
    - secretKey: ORCHESTRATOR_HERMES_API_KEY
      remoteRef:
        key: vocalmarket/orchestrator
        property: hermes_api_key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gateway-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: gateway-secret
  data:
    - secretKey: GATEWAY_JWT_SECRET
      remoteRef:
        key: vocalmarket/gateway
        property: jwt_secret
    - secretKey: GATEWAY_ALLOWED_ORIGINS
      remoteRef:
        key: vocalmarket/gateway
        property: allowed_origins
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: voice-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: voice-secret
  data:
    - secretKey: VOICE_ELEVENLABS_API_KEY
      remoteRef:
        key: vocalmarket/voice
        property: elevenlabs_api_key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: enthusiast-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: enthusiast-secret
  data:
    - secretKey: SECRET_KEY
      remoteRef:
        key: vocalmarket/enthusiast
        property: django_secret_key
    - secretKey: DATABASE_URL
      remoteRef:
        key: vocalmarket/enthusiast
        property: database_url
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: otel-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: otel-secret
  data:
    - secretKey: TEMPO_ENDPOINT
      remoteRef:
        key: vocalmarket/otel
        property: tempo_endpoint
