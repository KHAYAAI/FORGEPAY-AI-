---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice
spec:
  replicas: 2
  selector:
    matchLabels:
      app: voice
  template:
    metadata:
      labels:
        app: voice
    spec:
      containers:
        - name: voice
          image: vocalmarket/voice:latest
          ports:
            - containerPort: 8003
              name: http
          envFrom:
            - secretRef:
                name: voice-secret
          env:
            - name: VOICE_WHISPER_BASE_URL
              value: "http://whisper:9000"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: voice
spec:
  selector:
    app: voice
  ports:
    - port: 8003
      targetPort: 8003
      name: http
