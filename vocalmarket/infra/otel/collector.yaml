receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
  resource:
    attributes:
      - key: deployment.environment
        value: ${ENVIRONMENT:-development}
        action: insert

exporters:
  # Log to stdout for development; replace with proper backends in production
  debug:
    verbosity: normal
  # Production: send to Grafana Tempo (traces) + Prometheus (metrics)
  # otlp/tempo:
  #   endpoint: http://tempo:4317
  # prometheusremotewrite:
  #   endpoint: http://prometheus:9090/api/v1/write

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [debug]
